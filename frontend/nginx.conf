server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Same-origin API proxy - the SPA never needs CORS configuration since
    # /api/* and the static assets are served from the same host:port.
    location /api/ {
        proxy_pass ${API_PROXY_TARGET}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming (copilot chat) needs buffering off and a generous timeout.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback - client-side routing (React Router) owns everything else.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
